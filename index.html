<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>科学计算器 · 修复版</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            height: 100dvh;
            overflow: hidden;
            background: #000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: env(safe-area-inset-bottom, 0);
        }

        /* 历史面板 */
        .history-panel {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(8px);
            z-index: 200;
            transform: translateX(-100%);
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex;
            flex-direction: column;
        }

        .history-panel.show {
            transform: translateX(0);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top, 16px));
            border-bottom: 0.5px solid #333;
            flex-shrink: 0;
        }

        .history-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .history-clear, .history-close {
            font-size: 16px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 30px;
            background: #1c1c1e;
            color: #ff9500;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .history-item {
            padding: 14px 0;
            border-bottom: 0.5px solid #222;
            cursor: pointer;
            transition: background 0.1s;
        }

        .history-item:active {
            background: #1c1c1e;
        }

        .history-expr {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 6px;
            font-family: monospace;
            white-space: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }

        .history-result {
            color: #fff;
            font-size: 22px;
            font-weight: 350;
            word-break: break-word;
        }

        .empty-history {
            color: #555;
            text-align: center;
            padding: 40px;
            font-size: 15px;
        }

        .display {
            flex: 0 0 auto;
            height: 150px;
            padding: 16px 20px 12px 20px;
            padding-top: max(16px, env(safe-area-inset-top, 16px));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #000;
            overflow: hidden;
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .mode-indicator {
            color: #ff9500;
            font-size: 14px;
            font-weight: 600;
            background: #1c1c1e;
            padding: 4px 12px;
            border-radius: 30px;
        }

        .history-btn {
            background: #1c1c1e;
            border-radius: 30px;
            padding: 6px 12px;
            color: #ff9500;
            font-size: 16px;
            cursor: pointer;
        }

        /* 表达式滚动区 */
        .expression-area {
            text-align: right;
            color: #aaa;
            font-size: 18px;
            font-family: monospace;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            margin-bottom: 8px;
            padding-bottom: 4px;
            flex-shrink: 0;
        }
        .expression-area::-webkit-scrollbar {
            height: 2px;
            background: transparent;
        }
        .expression-area::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 2px;
        }

        /* 当前数字滚动区 */
        .current-area {
            text-align: right;
            color: #fff;
            font-size: clamp(32px, 12vw, 64px);
            font-weight: 350;
            line-height: 1.2;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            min-height: 76px;
            flex-shrink: 0;
        }
        .current-area::-webkit-scrollbar {
            height: 2px;
            background: transparent;
        }
        .current-area::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 2px;
        }

        .keyboard-scroll {
            flex: 1;
            min-height: 0;
            padding: 8px 8px 0 8px;
            display: flex;
            flex-direction: column;
        }

        .keyboard-inner {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 12px));
        }

        .keyboard-inner .scientific-grid {
            flex: 0 0 auto;
        }

        .keyboard-inner .main-grid {
            flex: 1;
            align-content: stretch;
        }

        /* 科学按键 (椭圆压缩) */
        .scientific-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .scientific-grid .btn {
            aspect-ratio: 1 / 0.6667;
            border-radius: 50%;
            font-size: clamp(0.7rem, 3.5vw, 0.9rem);
            background: #3a3a3c;
            font-weight: 500;
        }

        .scientific-grid .deg-rad-btn {
            background: #1c1c1e;
            color: #ff9500;
            font-weight: 600;
        }
        .scientific-grid .deg-rad-btn.active {
            background: #ff9500;
            color: #000;
        }

        /* 主键盘 */
        .main-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            aspect-ratio: 1 / 1;
            border-radius: 60px;
            border: none;
            font-size: 1.7rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s, filter 0.05s;
            background: #2c2c2e;
            color: white;
            font-family: inherit;
        }

        .btn:active {
            transform: scale(0.94);
            filter: brightness(1.2);
        }

        .btn-func {
            background: #3a3a3c;
            color: #fff;
            font-size: 1.2rem;
        }

        .btn-operator {
            background: #ff9500;
            color: #fff;
            font-size: 1.9rem;
        }

        .btn-equal {
            background: #ff9500;
        }

        .btn-number {
            background: #2c2c2e;
            font-size: 1.8rem;
        }

        .btn-zero {
            grid-column: span 2;
            aspect-ratio: 2 / 1;
            justify-content: flex-start;
            padding-left: 28px;
        }

        @media (max-height: 600px) {
            .display { height: 100px; padding: 8px 16px; }
            .current-area { font-size: clamp(26px, 8vw, 48px); min-height: 54px; }
            .expression-area { font-size: 15px; }
            .btn { font-size: 1.3rem; }
            .scientific-grid .btn { font-size: clamp(0.65rem, 3vw, 0.8rem); }
            .btn-func { font-size: 1rem; }
        }

        @media (orientation: landscape) and (max-height: 600px) {
            .calculator { flex-direction: row; max-width: none; }
            .display { flex: 0 0 35%; min-height: 0; height: 100%; justify-content: center; }
            .keyboard-scroll { flex: 1; }
            .scientific-grid { gap: 5px; }
            .main-grid { gap: 6px; }
            .main-grid .btn { aspect-ratio: auto; }
            .scientific-grid .btn { aspect-ratio: 1 / 0.7; }
        }

        @media (min-width: 768px) {
            .calculator { border-radius: 20px; max-height: 90dvh; height: 90dvh; margin: 5dvh auto; }
            body { background: #111; }
            .current-area { font-size: clamp(32px, 2.5vw, 56px); }
            .btn { font-size: clamp(1.3rem, 1.5vw, 1.6rem); }
            .scientific-grid .btn { font-size: clamp(0.7rem, 0.9vw, 0.9rem); }
        }

        .feedback-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.2s;
            z-index: 300;
            pointer-events: none;
            white-space: nowrap;
        }
        .feedback-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="calculator">
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <span class="history-clear" id="clearHistoryBtn">清除全部</span>
            <span class="history-title">记录</span>
            <span class="history-close" id="closeHistoryBtn">完成</span>
        </div>
        <div class="history-list" id="historyList">
            <div class="empty-history">暂无计算历史</div>
        </div>
    </div>

    <div class="display">
        <div class="display-header">
            <span class="mode-indicator" id="degRadLabel">DEG</span>
            <span class="history-btn" id="openHistoryBtn">历史</span>
        </div>
        <div class="expression-area" id="expressionDisplay"></div>
        <div class="current-area" id="currentDisplay">0</div>
    </div>

    <div class="keyboard-scroll">
        <div class="keyboard-inner">
            <div class="scientific-grid" id="scientificGrid">
                <button class="btn deg-rad-btn" id="degRadToggle">DEG</button>
                <button class="btn" data-func="sin">sin</button>
                <button class="btn" data-func="cos">cos</button>
                <button class="btn" data-func="tan">tan</button>
                <button class="btn" data-func="π">π</button>

                <button class="btn" data-func="x²">x²</button>
                <button class="btn" data-func="xⁿ">xⁿ</button>
                <button class="btn" data-func="√">√</button>
                <button class="btn" data-func="ln">ln</button>
                <button class="btn" data-func="log">log</button>

                <button class="btn" data-func="(">(</button>
                <button class="btn" data-func=")">)</button>
                <button class="btn" data-func="1/x">1/x</button>
                <button class="btn" data-func="e">e</button>
                <button class="btn" data-func="n!">n!</button>
            </div>

            <div class="main-grid">
                <button class="btn btn-func" id="soundToggleBtn">🔊</button>
                <button class="btn btn-func" id="clearAllBtn">AC</button>
                <button class="btn btn-func" id="deleteBtn">⌫</button>
                <button class="btn btn-operator" data-op="÷">÷</button>

                <button class="btn btn-number" data-num="7">7</button>
                <button class="btn btn-number" data-num="8">8</button>
                <button class="btn btn-number" data-num="9">9</button>
                <button class="btn btn-operator" data-op="×">×</button>

                <button class="btn btn-number" data-num="4">4</button>
                <button class="btn btn-number" data-num="5">5</button>
                <button class="btn btn-number" data-num="6">6</button>
                <button class="btn btn-operator" data-op="-">−</button>

                <button class="btn btn-number" data-num="1">1</button>
                <button class="btn btn-number" data-num="2">2</button>
                <button class="btn btn-number" data-num="3">3</button>
                <button class="btn btn-operator" data-op="+">+</button>

                <button class="btn btn-number btn-zero" data-num="0">0</button>
                <button class="btn btn-number" data-num=".">.</button>
                <button class="btn btn-equal" id="equalBtn">=</button>
            </div>
        </div>
    </div>
</div>
<div class="feedback-toast" id="toastMsg"></div>

<script>
    // ------------------- 全局状态 -------------------
    let expression = "";
    let resetOnNextInput = false;     // 等号或历史点后，下次输入数字需重置
    let isDegreeMode = true;
    let soundEnabled = true;
    let historyList = [];

    // DOM 元素
    const expressionDisplay = document.getElementById("expressionDisplay");
    const currentDisplay = document.getElementById("currentDisplay");
    const degRadLabel = document.getElementById("degRadLabel");
    const degRadToggle = document.getElementById("degRadToggle");
    const soundToggleBtn = document.getElementById("soundToggleBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const equalBtn = document.getElementById("equalBtn");
    const historyPanel = document.getElementById("historyPanel");
    const historyListDiv = document.getElementById("historyList");
    const openHistoryBtn = document.getElementById("openHistoryBtn");
    const closeHistoryBtn = document.getElementById("closeHistoryBtn");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    const toastMsg = document.getElementById("toastMsg");

    let audioCtx = null;

    // ------------------- 辅助函数 -------------------
    function showToast(text, duration = 1200) {
        toastMsg.textContent = text;
        toastMsg.classList.add("show");
        setTimeout(() => toastMsg.classList.remove("show"), duration);
    }

    function vibrate() {
        if (navigator.vibrate) navigator.vibrate(8);
    }

    async function playClickSound() {
        if (!soundEnabled) return;
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === "suspended") {
                await audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 820;
            osc.type = "sine";
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.06);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.06);
        } catch(e) { /* 静默 */ }
    }

    function buttonFeedback() {
        vibrate();
        playClickSound();
    }

    function saveHistory() {
        localStorage.setItem("calc_history_v2", JSON.stringify(historyList.slice(0, 50)));
    }

    function loadHistory() {
        const stored = localStorage.getItem("calc_history_v2");
        if (stored) {
            try {
                historyList = JSON.parse(stored);
            } catch(e) { historyList = []; }
        } else {
            historyList = [];
        }
        renderHistoryPanel();
    }

    function addHistory(expr, resultVal) {
        // 避免重复记录相同表达式和结果
        if (historyList.length > 0 && historyList[0].expr === expr && historyList[0].result === formatNumber(resultVal)) {
            return;
        }
        const resultStr = typeof resultVal === 'number' ? formatNumber(resultVal) : String(resultVal);
        historyList.unshift({
            expr: expr,
            result: resultStr,
            time: Date.now()
        });
        if (historyList.length > 50) historyList.pop();
        saveHistory();
        renderHistoryPanel();
    }

    function renderHistoryPanel() {
        if (!historyListDiv) return;
        if (historyList.length === 0) {
            historyListDiv.innerHTML = '<div class="empty-history">暂无计算历史</div>';
            return;
        }
        historyListDiv.innerHTML = historyList.map((item, idx) => `
            <div class="history-item" data-idx="${idx}">
                <div class="history-expr">${escapeHtml(item.expr)} =</div>
                <div class="history-result">${escapeHtml(item.result)}</div>
            </div>
        `).join('');
        document.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', (e) => {
                const idx = parseInt(el.dataset.idx);
                if (!isNaN(idx) && historyList[idx]) {
                    buttonFeedback();
                    const pastResult = historyList[idx].result;
                    // 重置表达式，并使用历史结果作为新起点
                    expression = "";
                    setCurrentDisplay(pastResult);
                    updateExpressionDisplay();
                    resetOnNextInput = true;   // 下次输入数字会覆盖
                    closeHistoryPanel();
                    autoScrollCurrentDisplay();
                }
                e.stopPropagation();
            });
        });
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function openHistoryPanel() {
        historyPanel.classList.add("show");
        renderHistoryPanel();
    }
    function closeHistoryPanel() {
        historyPanel.classList.remove("show");
    }
    function clearHistory() {
        if (historyList.length > 0) {
            historyList = [];
            saveHistory();
            renderHistoryPanel();
            showToast("历史已清空");
        } else {
            showToast("暂无历史");
        }
    }

    function updateExpressionDisplay() {
        if (expression === "") {
            expressionDisplay.textContent = "";
        } else {
            let disp = expression.replace(/\*/g, '×').replace(/\//g, '÷');
            expressionDisplay.textContent = disp;
            setTimeout(() => {
                expressionDisplay.scrollLeft = expressionDisplay.scrollWidth;
            }, 10);
        }
    }

    function setCurrentDisplay(value) {
        let str = formatNumber(value);
        currentDisplay.textContent = str;
        autoScrollCurrentDisplay();
    }

    function autoScrollCurrentDisplay() {
        setTimeout(() => {
            if (currentDisplay) {
                currentDisplay.scrollLeft = currentDisplay.scrollWidth;
            }
        }, 10);
    }

    // 增强的阶乘处理：递归替换 expression! 为 factorial(expression)
    function processFactorials(expr) {
        // 匹配任意表达式后跟 !，表达式可以包含括号和运算符
        // 使用正则 + 递归查找最外层括号
        let result = expr;
        let changed = true;
        while (changed) {
            changed = false;
            result = result.replace(/([^!]+?)!/g, (match, content) => {
                // 避免处理已经包裹 factorial 的内容
                if (match.includes('factorial')) return match;
                // 寻找完整的子表达式：可能包含括号
                let subExpr = content.trim();
                // 如果内容以括号开头，尝试匹配完整括号组
                if (subExpr.startsWith('(')) {
                    let depth = 0;
                    let endIndex = 0;
                    for (let i = 0; i < subExpr.length; i++) {
                        if (subExpr[i] === '(') depth++;
                        if (subExpr[i] === ')') depth--;
                        if (depth === 0) { endIndex = i + 1; break; }
                    }
                    if (endIndex > 0) {
                        subExpr = subExpr.substring(0, endIndex);
                    }
                }
                changed = true;
                return `factorial(${subExpr})`;
            });
        }
        return result;
    }

    // 表达式求值引擎 (支持四则、括号、幂、函数)
    function evaluateExpression(expr, degreeMode) {
        let processed = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/\^/g, '**');
        processed = processed.replace(/(\d\.?\d*)[eE]([+-]?\d+)/g, '$1__SCI__$2');
        processed = processed.replace(/π/g, 'Math.PI').replace(/e(?![a-zA-Z0-9_])/g, 'Math.E');
        processed = processed.replace(/__SCI__/g, 'e');
        
        // 处理阶乘 (支持嵌套括号)
        processed = processFactorials(processed);
        
        if (degreeMode) {
            processed = processed.replace(/sin\(/g, 'sin_deg(');
            processed = processed.replace(/cos\(/g, 'cos_deg(');
            processed = processed.replace(/tan\(/g, 'tan_deg(');
        }
        processed = processed.replace(/ln\(/g, 'Math.log(');
        processed = processed.replace(/log\(/g, 'Math.log10(');
        processed = processed.replace(/√\(/g, 'Math.sqrt(');
        processed = processed.replace(/(\d+(?:\.\d+)?|\))\s*x²/g, '($1)**2');
        processed = processed.replace(/x²/g, '**2');
        processed = processed.replace(/1\/x\(/g, '1/(');

        const toRad = (deg) => deg * Math.PI / 180;
        const sin_deg = (x) => Math.sin(toRad(x));
        const cos_deg = (x) => Math.cos(toRad(x));
        const tan_deg = (x) => {
            const rad = toRad(x);
            const cos = Math.cos(rad);
            if (Math.abs(cos) < 1e-12) return Infinity;
            return Math.tan(rad);
        };
        
        function factorial(n) {
            if (n < 0 || !Number.isInteger(n)) return NaN;
            if (n === 0 || n === 1) return 1;
            let res = 1;
            for (let i = 2; i <= n; i++) res *= i;
            return res;
        }

        try {
            const fn = new Function('Math', 'sin_deg', 'cos_deg', 'tan_deg', 'factorial', `'use strict'; return (${processed})`);
            let result = fn(Math, sin_deg, cos_deg, tan_deg, factorial);
            if (isNaN(result)) throw new Error("无效结果");
            return result;
        } catch (err) {
            console.warn(err);
            return NaN;
        }
    }

    function formatNumber(num) {
        if (num === undefined || num === null) return "0";
        if (typeof num === 'string') num = parseFloat(num);
        if (!isFinite(num)) return num === Infinity ? "Infinity" : num === -Infinity ? "-Infinity" : "Error";
        if (Math.abs(num) > 1e15 || (Math.abs(num) < 1e-10 && num !== 0))
            return num.toExponential(10);
        let str = String(num);
        if (str.length > 14) str = num.toPrecision(12);
        return str;
    }

    function computeResult() {
        buttonFeedback();
        if (expression.trim() === "") {
            let currVal = currentDisplay.textContent;
            if (currVal === "0" || currVal === "Error" || currVal === "Infinity" || currVal === "-Infinity") return;
            expression = currVal;
            updateExpressionDisplay();
        }
        let exprToEval = expression;
        try {
            let result = evaluateExpression(exprToEval, isDegreeMode);
            if (isNaN(result)) {
                setCurrentDisplay("Error");
                showToast("表达式无效");
                return;
            }
            let formattedResult = formatNumber(result);
            addHistory(exprToEval, result);
            setCurrentDisplay(formattedResult);
            expression = result.toString();
            updateExpressionDisplay();
            resetOnNextInput = true;
        } catch (e) {
            setCurrentDisplay("Error");
            showToast("语法错误");
        }
    }

    // 检查字符是否为运算符 (不包括负号单独处理)
    function isOperator(ch) {
        return ch === '+' || ch === '-' || ch === '*' || ch === '/' || ch === '×' || ch === '÷';
    }

    function appendToExpression(char) {
        buttonFeedback();
        // 重置标志：如果用户输入数字或小数点，且需要重置，则清空表达式
        if (resetOnNextInput && /[\d.]/.test(char)) {
            expression = "";
            resetOnNextInput = false;
        }
        // 连续运算符纠正：如果表达式最后是运算符，新输入也是运算符，则替换最后一个运算符
        if (expression.length > 0 && isOperator(expression[expression.length-1]) && isOperator(char)) {
            // 替换最后一个字符
            expression = expression.slice(0, -1) + char;
            updateExpressionDisplay();
            // 预览更新
            try {
                let preview = evaluateExpression(expression, isDegreeMode);
                if (!isNaN(preview) && isFinite(preview)) {
                    setCurrentDisplay(formatNumber(preview));
                } else {
                    // 如果预览无效，保持当前显示（不显示...）
                }
            } catch(e) {}
            return;
        }
        // 正常追加
        expression += char;
        updateExpressionDisplay();
        // 实时预览
        try {
            let preview = evaluateExpression(expression, isDegreeMode);
            if (!isNaN(preview) && isFinite(preview)) {
                setCurrentDisplay(formatNumber(preview));
            } else {
                // 表达式不完整时，保留原有显示不变（不再显示 ...）
            }
        } catch (e) { /* 忽略 */ }
        autoScrollCurrentDisplay();
    }

    function applyFunction(func) {
        buttonFeedback();
        // 函数会改变表达式，应清除重置标志
        if (resetOnNextInput) {
            resetOnNextInput = false;
        }
        if (func === 'π') appendToExpression('π');
        else if (func === 'e') appendToExpression('e');
        else if (func === 'x²') appendToExpression('^2');
        else if (func === 'xⁿ') appendToExpression('^');
        else if (func === '√') appendToExpression('√(');
        else if (func === 'ln') appendToExpression('ln(');
        else if (func === 'log') appendToExpression('log(');
        else if (func === '1/x') {
            let curr = parseFloat(currentDisplay.textContent.replace(/,/g, ''));
            if (curr && isFinite(curr)) {
                expression = "1/(" + curr + ")";
                updateExpressionDisplay();
                computeResult();
                return;
            }
        }
        else if (func === 'n!') appendToExpression('!');
        else if (func === 'sin' || func === 'cos' || func === 'tan') appendToExpression(`${func}(`);
        else if (func === '(' || func === ')') appendToExpression(func);
    }

    function clearAll() {
        buttonFeedback();
        expression = "";
        updateExpressionDisplay();
        setCurrentDisplay("0");
        resetOnNextInput = false;
    }

    function deleteLast() {
        buttonFeedback();
        if (expression.length > 0) {
            expression = expression.slice(0, -1);
            updateExpressionDisplay();
            if (expression === "") {
                setCurrentDisplay("0");
            } else {
                try {
                    let preview = evaluateExpression(expression, isDegreeMode);
                    if (!isNaN(preview) && isFinite(preview)) {
                        setCurrentDisplay(formatNumber(preview));
                    } else {
                        // 表达式不完整，保留当前显示（不改变）
                        // 什么也不做，避免显示 ...
                    }
                } catch(e) {
                    // 保留原显示
                }
            }
        } else {
            setCurrentDisplay("0");
        }
        resetOnNextInput = false;
        autoScrollCurrentDisplay();
    }

    function toggleDegRad() {
        buttonFeedback();
        isDegreeMode = !isDegreeMode;
        const modeText = isDegreeMode ? "DEG" : "RAD";
        degRadLabel.textContent = modeText;
        degRadToggle.textContent = modeText;
        degRadToggle.classList.toggle("active", isDegreeMode);
        showToast(isDegreeMode ? "角度模式" : "弧度模式");
        if (expression !== "") {
            try {
                let preview = evaluateExpression(expression, isDegreeMode);
                if (!isNaN(preview) && isFinite(preview)) {
                    setCurrentDisplay(formatNumber(preview));
                }
            } catch(e) {}
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        soundToggleBtn.textContent = soundEnabled ? "🔊" : "🔇";
        showToast(soundEnabled ? "按键音开" : "按键音关");
        if (soundEnabled && audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume();
        }
    }

    // ------------------- 事件绑定 -------------------
    function bindEvents() {
        document.querySelectorAll(".btn-number").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                let num = btn.getAttribute("data-num");
                if (num) appendToExpression(num);
            });
        });
        document.querySelectorAll(".btn-operator").forEach(btn => {
            btn.addEventListener("click", (e) => {
                let op = btn.getAttribute("data-op");
                if (op === "÷") appendToExpression("/");
                else if (op === "×") appendToExpression("*");
                else if (op === "+") appendToExpression("+");
                else if (op === "-") appendToExpression("-");
                else appendToExpression(op);
                resetOnNextInput = false;   // 按运算符后不应重置
            });
        });
        document.querySelectorAll("[data-func]").forEach(btn => {
            btn.addEventListener("click", (e) => {
                let func = btn.getAttribute("data-func");
                applyFunction(func);
            });
        });
        equalBtn.addEventListener("click", computeResult);
        clearAllBtn.addEventListener("click", clearAll);
        deleteBtn.addEventListener("click", deleteLast);
        soundToggleBtn.addEventListener("click", toggleSound);
        degRadToggle.addEventListener("click", toggleDegRad);
        openHistoryBtn.addEventListener("click", openHistoryPanel);
        closeHistoryBtn.addEventListener("click", closeHistoryPanel);
        clearHistoryBtn.addEventListener("click", clearHistory);
        window.addEventListener("keydown", (e) => {
            const key = e.key;
            if (/[\d\.]/.test(key)) {
                appendToExpression(key);
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                let op = key;
                if (op === '*') appendToExpression('*');
                else if (op === '/') appendToExpression('/');
                else appendToExpression(op);
                resetOnNextInput = false;
            } else if (key === 'Enter' || key === '=') {
                e.preventDefault();
                computeResult();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === '(' || key === ')') {
                appendToExpression(key);
            } else if (key === 'e') {
                if (resetOnNextInput) { expression = ""; resetOnNextInput = false; }
                applyFunction('e');
            }
        });
    }

    function init() {
        loadHistory();
        bindEvents();
        clearAll();
        setCurrentDisplay("0");
        document.body.addEventListener("click", () => {
            if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        }, { once: true });
    }
    init();
</script>
<script>
  // 可选 Service Worker (文件缺失不影响使用)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW 未注册'));
  }
</script>
